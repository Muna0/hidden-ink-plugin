[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiddenink"
version = "0.1.0"
description = "Find hidden text in documents that AI can read but people cannot see."
requires-python = ">=3.11"
dependencies = [
  "lxml>=5.2",
  "pdfminer.six>=20240706",
  "pypdfium2>=4.30",
  "numpy>=1.26",
  "pillow>=10.3",
  "reportlab>=4.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "mcp>=1.25,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
hiddenink = "hiddenink.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hiddenink = ["webapp/**/*"]

# Satoshi may be used on the hosted website only (ITF Free Font License): never ship it in the package.
[tool.setuptools.exclude-package-data]
hiddenink = ["webapp/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
